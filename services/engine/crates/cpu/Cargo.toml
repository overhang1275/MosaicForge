[package]
name = "mosaicforge-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
i_overlay = { version = "=9.0.1", default-features = false }
kurbo = { version = "=0.13.1", default-features = false, features = ["std"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
mosaicforge-core = { path = "../core" }
pdf-writer = { version = "=0.15.0", default-features = false }
resvg = { version = "=0.47.0", default-features = false }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
