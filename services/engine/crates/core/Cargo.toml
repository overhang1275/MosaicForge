[package]
name = "mosaicforge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.10"
sha2 = "0.10"
quick-xml = "=0.42.0"
usvg = { version = "=0.47.0", default-features = false }
svgtypes = "0.16"

[build-dependencies]
typify = { version = "0.8", default-features = false }
serde_json = "1"
syn = "2"
prettyplease = "0.2"
