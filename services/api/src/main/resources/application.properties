server.address=127.0.0.1
server.port=${MOSAICFORGE_API_PORT:4772}
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=16
server.tomcat.accept-count=2
server.tomcat.connection-timeout=30s
server.tomcat.connection-upload-timeout=30s
server.tomcat.disable-upload-timeout=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=3s
spring.main.banner-mode=off
logging.structured.format.console=logstash
mosaicforge.api-token=${MOSAICFORGE_API_TOKEN}
mosaicforge.engine-token=${MOSAICFORGE_ENGINE_TOKEN}
mosaicforge.engine-url=${MOSAICFORGE_ENGINE_URL:http://127.0.0.1:4771}
mosaicforge.persistence.enabled=${MOSAICFORGE_PERSISTENCE_ENABLED:false}
mosaicforge.persistence.url=${MOSAICFORGE_DB_URL:}
mosaicforge.persistence.user=${MOSAICFORGE_DB_USER:}
mosaicforge.persistence.password=${MOSAICFORGE_DB_PASSWORD:}
mosaicforge.persistence.owner-id=${MOSAICFORGE_LOCAL_USER_ID:}
mosaicforge.jobs.enabled=${MOSAICFORGE_JOBS_ENABLED:false}
mosaicforge.jobs.valkey-uri=${MOSAICFORGE_VALKEY_URI:}
mosaicforge.jobs.valkey-password=${MOSAICFORGE_VALKEY_PASSWORD:}
